[workspace]
resolver = "3"
members = ["client","peers","requests","server","wallet"]

[workspace.dependencies]
blockchain = { path = "../blockchain/blockchain" }
bytes-utils = { path = "../blockchain/bytes" }

actix-web = "4.11.0"
aes-gcm = "0.10.3"
chrono = "0.4.41"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
pgp = "0.16.0"
rand = "^0.8"
reqwest = "0.12.23"
sha2 = "0.10.9"
tokio = { version = "1.46.1", features = ["full"] }
